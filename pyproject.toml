[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-tests"
version = "0.2.1"
description = "Structured B/O/E testing framework for LLM operating systems and agent hubs"
readme = "README.md"
authors = [
    { name = "Lukas Geiger" }
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
keywords = [
    "llm-os",
    "agent-hub",
    "skill-testing",
    "b-o-e-framework",
    "quality-assurance",
    "evaluation",
    "ai-agents",
    "benchmarking",
    "zero-egress",
    "open-source"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ellmos-tests"
Documentation = "https://github.com/ellmos-ai/ellmos-tests#readme"
Repository = "https://github.com/ellmos-ai/ellmos-tests.git"
Issues = "https://github.com/ellmos-ai/ellmos-tests/issues"
Changelog = "https://github.com/ellmos-ai/ellmos-tests/blob/master/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/ellmos-tests/blob/master/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/ellmos-tests/blob/master/THIRD_PARTY_LICENSES.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Marketing Log" = "https://github.com/ellmos-ai/ellmos-tests/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/ellmos-tests/blob/master/llms.txt"

[tool.ruff]
line-length = 100
target-version = "py310"
