[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-tests"
version = "0.2.0"
description = "Structured B/O/E testing framework for LLM operating systems and agent hubs"
readme = "README.md"
authors = [
    { name = "Lukas Geiger" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm-os", "agent-hub", "skill-testing", "b-o-e-framework", "quality-assurance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ellmos-tests"
Repository = "https://github.com/ellmos-ai/ellmos-tests.git"
Issues = "https://github.com/ellmos-ai/ellmos-tests/issues"
