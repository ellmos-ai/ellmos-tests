name: ellmos-tests smoke tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements and dev tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff "setuptools>=77.0.3" "packaging>=24.2"

      - name: Verify packaging metadata (dry-run)
        run: python -m pip install --no-build-isolation --dry-run .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q system_diff_tests testing tests tools

      - name: Run unit tests (unittest)
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run pytest regression suite
        run: pytest -ra

      - name: List test batteries
        run: python tests/run_batteries.py --list
