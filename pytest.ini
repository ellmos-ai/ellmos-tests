[pytest]
# Die automatisierte Suite lebt ausschliesslich in tests/.
#
# testing/ enthaelt manuelle HQ5-/HQ6-Skripte, die trotz test_*-Namen keine
# Unit-Tests sind: sie laden bach_api aus einer echten BACH-Installation und
# schreiben dort hinein (task add, mem write). Ohne diese Begrenzung wuerde ein
# blosses `pytest` im Repo-Root sie einsammeln und in die produktive BACH-DB
# schreiben. Die Skripte werden per `python testing/<skript>.py` gestartet.
testpaths = tests
python_files = test_*.py
